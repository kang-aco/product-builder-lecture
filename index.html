
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dinner Menu Recommender</title>
    <link rel="stylesheet" href="style.css">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6776450039681647"
     crossorigin="anonymous"></script>
    <meta name="google-adsense-account" content="ca-pub-6776450039681647">
</head>
<body>
    <div class="container">
        <div class="theme-switch-wrapper">
            <label class="theme-switch" for="checkbox">
                <input type="checkbox" id="checkbox" />
                <div class="slider round"></div>
            </label>
        </div>
        <h1>오늘 저녁 뭐 먹지?</h1>
        <div id="menu-recommendation-container">
            <div class="menu-item">
                <span class="recommendation">오늘의 추천 메뉴</span>
                <img src="https://upload.wikimedia.org/wikipedia/commons/a/a3/Eq_it-na_pizza-margherita_sep2005_sml.jpg" alt="Pizza Image" class="menu-image hidden">
            </div>
        </div>
        <button id="generate-btn">메뉴 추천 받기</button>
    </div>
    <div class="form-container">
        <h2>제휴 문의</h2>
        <form id="affiliate-form" action="https://formspree.io/f/xaqdwkya" method="POST">
            <label for="name">이름:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">이메일:</label>
            <input type="email" id="email" name="email" required>

            <label for="company">회사명:</label>
            <input type="text" id="company" name="company">

            <label for="message">메시지:</label>
            <textarea id="message" name="message" rows="5" required></textarea>

            <button type="submit">보내기</button>
        </form>
        <p id="form-success-message" class="hidden">문의해주셔서 감사합니다! 최대한 빨리 답변드리겠습니다.</p>
    </div>

    <script src="main.js"></script>

    <div id="disqus_thread"></div>
