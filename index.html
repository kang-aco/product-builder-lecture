
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dinner Menu Recommender</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="theme-switch-wrapper">
            <label class="theme-switch" for="checkbox">
                <input type="checkbox" id="checkbox" />
                <div class="slider round"></div>
            </label>
        </div>
        <h1>오늘 저녁 뭐 먹지?</h1>
        <div id="menu-recommendation-container">
            <div class="menu-item">
                <span class="recommendation">오늘의 추천 메뉴</span>
                <img src="pizza.svg" alt="Pizza Image" class="menu-image hidden">
            </div>
        </div>
        <button id="generate-btn">메뉴 추천 받기</button>
    </div>
    <script src="main.js"></script>
</body>
</html>
